name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Zainstaluj wymagane Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zbuduj APK
        working-directory: Treningownik
        run: gradle :app:assembleDebug --stacktrace

      - name: Przygotuj APK
        run: cp Treningownik/app/build/outputs/apk/debug/app-debug.apk Treningownik.apk

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Treningownik-APK
          path: Treningownik.apk
          if-no-files-found: error
          retention-days: 30
